<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714" />
      <stop offset="50%" stop-color="#091026" />
      <stop offset="100%" stop-color="#050716" />
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0047b3" />
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00c8e0" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#00f2fe" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Subtle Circuit Lines -->
  <path d="M40 180 H140 L180 220" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.15" fill="none" />
  <path d="M472 340 H380 L340 300" stroke="#a855f7" stroke-width="2" stroke-opacity="0.15" fill="none" />
  <circle cx="180" cy="220" r="4" fill="#00f2fe" opacity="0.3" />
  <circle cx="340" cy="300" r="4" fill="#a855f7" opacity="0.3" />

  <!-- Logo Graphics -->
  <g transform="translate(68, 126)" filter="url(#neonGlow)">
    <!-- Letter P -->
    <path d="M 30 20 L 140 20 C 185 20, 215 50, 215 95 C 215 140, 185 170, 140 170 L 95 170 L 95 240 L 30 240 Z M 95 75 L 95 115 L 135 115 C 150 115, 160 108, 160 95 C 160 82, 150 75, 135 75 Z" fill="url(#pGrad)" />

    <!-- Stylized Phone Receiver C -->
    <g transform="translate(180, 0)">
      <!-- Outer C Arc shaped as phone handset with cyber cuts -->
      <path d="M 125 35 
               C 185 60, 215 120, 195 180 
               C 178 230, 125 260, 70 245 
               C 42 238, 25 220, 12 195 
               L 48 175 
               C 56 188, 70 198, 88 202 
               C 122 210, 155 190, 165 155 
               C 175 118, 155 80, 118 65 
               C 102 58, 88 59, 75 66 
               L 52 30 
               C 72 18, 98 16, 125 35 Z" fill="url(#cGrad)" />
      <!-- Cyberphone earpiece and mouthpiece diagonal cutouts -->
      <line x1="95" y1="20" x2="135" y2="55" stroke="#040714" stroke-width="8" stroke-linecap="round" />
      <line x1="30" y1="185" x2="68" y2="225" stroke="#040714" stroke-width="8" stroke-linecap="round" />
    </g>
  </g>
</svg>
